<!DOCTYPE html>
<html>
<head>
    <title>Shipment Label Scanner</title>
</head>
<body>
    <h1>Scan Shipment Label</h1>
    
    <input type="file" id="fileInput" accept="image/*">
    <button onclick="scanLabel()">Scan Shipment Label</button>
    
    <div id="loading" style="display:none;">Scanning...</div>
    <div id="results"></div>

    <script>
        const API_URL = 'https://yjqxv4hlx3.execute-api.us-east-1.amazonaws.com/api';

        async function scanLabel() {
            const fileInput = document.getElementById('fileInput');
            const file = fileInput.files[0];
            
            if (!file) {
                alert('Please select an image file');
                return;
            }

            document.getElementById('loading').style.display = 'block';
            document.getElementById('results').innerHTML = '';

            try {
                const base64 = await new Promise((resolve) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result.split(',')[1]);
                    reader.readAsDataURL(file);
                });

                const response = await fetch(`${API_URL}/upload`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        file_data: base64,
                        filename: file.name,
                        user_id: 'user123',
                        comment: 'Scanned from web'
                    })
                });

                const data = await response.json();
                const e = data.entities || {};
                document.getElementById('results').innerHTML = `
                    <p>First Name: ${e.first_name || ''}</p>
                    <p>Last Name: ${e.last_name || ''}</p>
                    <p>Unit Number: ${e.unit_number || ''}</p>
                    <p>Tracking Number: ${e.tracking_number || ''}</p>
                    <p>Full Address: ${e.full_address || ''}</p>
                `;
            } catch (error) {
                document.getElementById('results').innerHTML = 
                    '<h3>Error:</h3>' + error.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
